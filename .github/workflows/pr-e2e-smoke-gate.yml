name: PR E2E Smoke Gate

on:
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: pr-e2e-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    name: E2E Smoke (PR Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:6
        ports:
          - '27017:27017'
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Compute Cypress tags from PR labels
        id: tags
        shell: bash
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          include='@smoke'
          exclude='@flaky'
          # Extract label names (lowercased)
          names=$(echo "$LABELS_JSON" | jq -r '.[].name' 2>/dev/null | tr '[:upper:]' '[:lower:]' | tr '\n' ',')
          echo "PR labels: ${names}"
          # Include mappings (persona)
          echo "$names" | grep -q 'e2e-include-a11y' && include="$include,@a11y" || true
          echo "$names" | grep -q 'e2e-include-negative' && include="$include,@negative" || true
          echo "$names" | grep -q 'e2e-include-admin' && include="$include,@admin" || true
          echo "$names" | grep -q 'e2e-include-payments' && include="$include,@payments" || true
          echo "$names" | grep -q 'e2e-include-vendor' && include="$include,@vendor" || true
          echo "$names" | grep -q 'e2e-include-buyer' && include="$include,@buyer" || true
          # Include mappings (threads)
          echo "$names" | grep -q 'e2e-include-checkout' && include="$include,@checkout-flow" || true
          echo "$names" | grep -q 'e2e-include-auth' && include="$include,@auth-flow" || true
          echo "$names" | grep -q 'e2e-include-orders' && include="$include,@orders-flow" || true
          echo "$names" | grep -q 'e2e-include-refund' && include="$include,@refund-flow" || true
          # Exclude mappings
          echo "$names" | grep -q 'e2e-exclude-payments' && exclude="$exclude,@payments" || true
          echo "$names" | grep -q 'e2e-exclude-slow' && exclude="$exclude,@slow" || true
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "exclude=$exclude" >> "$GITHUB_OUTPUT"
      - name: Comment tag scope on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const include = '${{ steps.tags.outputs.include }}' || '@smoke';
            const exclude = '${{ steps.tags.outputs.exclude }}' || '@flaky';
            const body = [
              '### E2E Smoke Scope',
              '',
              `Included tags: \\`${include}\\``,
              `Excluded tags: \\`${exclude}\\``,
              '',
              'Labels can tune scope, e.g.:',
              '- e2e-include-a11y, e2e-include-admin, e2e-include-vendor, e2e-include-buyer',
              '- e2e-include-checkout, e2e-include-auth, e2e-include-refund',
              '- e2e-exclude-slow, e2e-exclude-payments',
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Run smoke suite by tag (@smoke) with 5 min budget (curated)
        id: run_smoke
        working-directory: frontend
        env:
          CI: 'true'
          E2E_EPHEMERAL: 'true'
          E2E_AUTODROP: 'true'
          E2E_BACKEND_PORT: '5051'
          CYPRESS_retries: '2'
          CYPRESS_INCLUDE_TAG: ${{ steps.tags.outputs.include }}
          CYPRESS_EXCLUDE_TAG: ${{ steps.tags.outputs.exclude }}
        run: |
          start=$(date +%s)
          node ./scripts/run-e2e.js --pr-smoke
          status=$?
          end=$(date +%s)
          duration=$((end-start))
          echo "duration_seconds=${duration}" >> $GITHUB_OUTPUT
          exit $status

      - name: Append Cypress summary to Job Summary
        if: always()
        run: |
          if [ -f "frontend/cypress-summary.txt" ]; then
            echo "## Cypress summary" >> $GITHUB_STEP_SUMMARY
            cat frontend/cypress-summary.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "No cypress-summary.txt found." >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "frontend/scope-report.txt" ]; then
            echo "\n## E2E scope" >> $GITHUB_STEP_SUMMARY
            head -n 100 frontend/scope-report.txt >> $GITHUB_STEP_SUMMARY
          fi
      - name: Enforce runtime budget (<= 300s)
        if: always()
        run: |
          if [ -z "${{ steps.run_smoke.outputs.duration_seconds }}" ]; then
            echo "::error::Missing duration output; failing gate."
            exit 1
          fi
          dur=${{ steps.run_smoke.outputs.duration_seconds }}
          echo "Total duration: ${dur}s"
          if [ "$dur" -gt "300" ]; then
            echo "::error::Smoke suite exceeded 5 minutes (${dur}s)."
            exit 1
          fi
      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7
      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          retention-days: 7
      - name: Upload logs & summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-and-summary
          path: |
            frontend/cypress-summary.txt
            frontend/cypress-results/*.json
            backend/jest-results.json
            frontend/e2e-backend.log
            frontend/e2e-backend.err.log
            frontend/e2e-meta.txt
            frontend/scope-report.json
            frontend/scope-report.txt
          retention-days: 7
