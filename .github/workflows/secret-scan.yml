name: Secret Scan

# Continuous secret detection using gitleaks.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'   # Daily 02:00 UTC scan of default branch
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # needed for SARIF upload

jobs:
  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can diff properly

      - name: Run gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Use custom config to trim intentional test fixture noise.
          args: --no-banner --redact --config-path .gitleaks.toml --report-format sarif --report-path gitleaks.sarif --exit-code 1 detect

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

      - name: Summary (success)
        if: success()
        run: echo "✅ No secrets detected by gitleaks." >> $GITHUB_STEP_SUMMARY

      - name: Summary (fail)
        if: failure()
        run: echo "❌ Potential secrets detected. Review SARIF results in Security > Code scanning alerts." >> $GITHUB_STEP_SUMMARY
