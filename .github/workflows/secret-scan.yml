name: Secret Scan

# This workflow was previously empty; now adds gitleaks scanning.

on:
	push:
		branches: [ main ]
	pull_request:
		branches: [ main ]
	workflow_dispatch:

permissions:
	contents: read
	security-events: write

jobs:
	gitleaks:
		name: gitleaks scan
		runs-on: ubuntu-latest
		timeout-minutes: 10
		steps:
			- name: Checkout
				uses: actions/checkout@v4
				with:
					fetch-depth: 0

			- name: Run gitleaks
				uses: gitleaks/gitleaks-action@v2
				env:
					GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
				with:
					args: --no-banner --redact --exit-code 1 detect

			- name: Summary
				if: success()
				run: echo "✅ No secrets detected by gitleaks." >> $GITHUB_STEP_SUMMARY

			- name: Summary (fail)
				if: failure()
				run: echo "❌ Potential secrets detected. Review gitleaks log output." >> $GITHUB_STEP_SUMMARY
