name: PR Smoke Gate (5 min budget)

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:6
        ports:
          - '27017:27017'
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Restore Cypress binary cache
        id: cypress-cache
        uses: actions/cache@v4
        with:
          path: ./.cache/cypress
          key: cypress-${{ runner.os }}-pr-smoke-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-pr-smoke-
            cypress-${{ runner.os }}-
      - name: Ensure Cypress binary (install/verify)
        if: steps.cypress-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        env:
          CI: 'true'
          CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/cypress
        run: |
          npx cypress install --force || npx cypress verify
      - name: Run smoke (measure time and gate)
        id: smoke
        working-directory: frontend
        env:
          CI: 'true'
          E2E_EPHEMERAL: 'true'
          E2E_AUTODROP: 'true'
          E2E_BACKEND_PORT: '5051'
          CYPRESS_retries: '2'
          CYPRESS_EXCLUDE_TAG: '@flaky'
          CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/cypress
          # Focus a fast, stable subset
          E2E_SPEC: >-
            cypress/e2e/basic_navigation.cy.js,
            cypress/e2e/cart_checkout_button.cy.js,
            cypress/e2e/login_error.cy.js,
            cypress/e2e/card_intent.cy.js
        run: |
          start=$(date +%s)
          set +e
          npm run e2e:run
          code=$?
          set -e
          end=$(date +%s)
          echo "duration=$((end-start))" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Enforce 5-minute budget
        if: always()
        run: |
          dur=${{ steps.smoke.outputs.duration }}
          echo "Total duration: ${dur}s"
          if [ -z "$dur" ]; then
            echo "::warning::Smoke duration unavailable; preserving original smoke step result."
            exit 0
          fi
          if [ "$dur" -gt 300 ]; then
            echo "::warning::Smoke suite exceeded 300s target (${dur}s) but is within grace window."
          fi
          if [ "$dur" -gt 330 ]; then
            echo "::error::Smoke suite exceeded hard budget (<=330s with CI grace)."
            exit 1
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-artifacts
          path: |
            frontend/cypress-summary.txt
            frontend/cypress-results/*.json
            frontend/cypress/screenshots
            frontend/cypress/videos
            frontend/e2e-backend.log
            frontend/e2e-backend.err.log
            frontend/e2e-meta.txt
          retention-days: 7
