name: E2E Weekly Cross-Browser (@smoke)

on:
  schedule:
    # Every Sunday at 03:15 UTC
    - cron: '15 3 * * 0'
  workflow_dispatch:

jobs:
  cross-browser:
    name: E2E (@smoke) - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    services:
      mongo:
        image: mongo:6
        ports:
          - '27017:27017'
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure npm retries (resilient to 5xx)
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 60000
          npm config set fetch-retry-mintimeout 10000
          npm config set prefer-online true

      - name: Install backend deps
        working-directory: backend
        run: |
          set -e
          (npm ci --no-audit --no-fund) \
          || (echo "npm ci failed, retrying in 10s..." && sleep 10 && npm ci --no-audit --no-fund) \
          || (echo "npm ci failed again, retrying in 20s..." && sleep 20 && npm ci --no-audit --no-fund)

      - name: Install frontend deps
        working-directory: frontend
        run: |
          set -e
          (npm ci --no-audit --no-fund) \
          || (echo "npm ci failed, retrying in 10s..." && sleep 10 && npm ci --no-audit --no-fund) \
          || (echo "npm ci failed again, retrying in 20s..." && sleep 20 && npm ci --no-audit --no-fund)

      - name: Restore Cypress binary cache
        id: cypress-cache
        uses: actions/cache@v4
        with:
          path: ./.cache/cypress
          key: cypress-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-${{ matrix.browser }}-

      - name: Setup Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: Setup Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Ensure Cypress binary (install/verify)
        if: steps.cypress-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        env:
          CI: 'true'
          CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/cypress
        run: |
          npx cypress install --force || npx cypress verify

      - name: Run @smoke E2E on ${{ matrix.browser }} (build-and-serve)
        working-directory: frontend
        env:
          CI: 'true'
          # Use isolated ephemeral DB per run and drop automatically
          E2E_EPHEMERAL: 'true'
          E2E_AUTODROP: 'true'
          # Prefer non-default backend port to avoid collisions
          E2E_BACKEND_PORT: '5051'
          # Select Cypress browser via runner
          E2E_BROWSER: '${{ matrix.browser }}'
          # Filter to fast, stable smoke specs only
          CYPRESS_INCLUDE_TAG: '@smoke'
          # Avoid quarantined specs in weekly cross-browser check
          CYPRESS_EXCLUDE_TAG: '@flaky'
          # Light flake insurance
          CYPRESS_retries: '2'
          # Force runner to enumerate all specs (then tags will skip others)
          E2E_USE_ALL: 'true'
          # Ensure Cypress uses the repo-local cache so it matches the cached path
          CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/cypress
        run: npm run e2e:run

      - name: Append Cypress summary to Job Summary
        if: always()
        shell: bash
        run: |
          if [ -f "frontend/cypress-summary.txt" ]; then
            echo "### Cypress summary (${{ matrix.browser }})" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            cat frontend/cypress-summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No cypress-summary.txt found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Cypress screenshots (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: |
            frontend/cypress/screenshots
            !frontend/cypress/screenshots/**/.gitkeep
          retention-days: 7

      - name: Upload Cypress videos (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ matrix.browser }}
          path: |
            frontend/cypress/videos
            !frontend/cypress/videos/**/.gitkeep
          retention-days: 7

      - name: Upload logs & summary (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-and-summary-${{ matrix.browser }}
          path: |
            frontend/cypress-summary.txt
            frontend/cypress-results/*.json
            frontend/e2e-backend.log
            frontend/e2e-backend.err.log
            frontend/e2e-meta.txt
          retention-days: 7
