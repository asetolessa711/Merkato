name: Frontend Tests

on:
  push:
    branches:
      - main
      - dev
      - feat/**
      - bugfix/**
      - chore/**
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Guard against duplicate basenames (.js/.jsx)
        id: dup_guard
        continue-on-error: true
        run: npm run -s dup:guard
      - name: Duplicate basename guard notice
        if: steps.dup_guard.outcome == 'failure'
        run: echo "::warning::Duplicate basename guard failed; continuing to run tests for actionable test signal."
      - name: Run frontend tests
        env:
          CI: true
        run: npm test -- --watchAll=false --coverage