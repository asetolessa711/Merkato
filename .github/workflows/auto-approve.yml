name: Auto-approve PR

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    # Safety: only same-repo branches, and only PRs opened by you
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'asetolessa711' }}
    runs-on: ubuntu-latest

    steps:
      - name: Normalize + validate GitHub App private key
        env:
          PRIVATE_KEY_RAW: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os, re, sys

          key = os.environ.get('PRIVATE_KEY_RAW', '')
          if not key.strip():
            print('AUTO_APPROVE_PRIVATE_KEY is empty or not set.')
            sys.exit(1)

          # Common copy/paste issue: secret stored with literal "\\n" instead of real newlines.
          if '\\n' in key:
            key = key.replace('\\r\\n', '\n').replace('\\n', '\n')

          # Do not print the key. Only validate expected PEM markers.
          has_begin = re.search(r'^-----BEGIN (RSA )?PRIVATE KEY-----\s*$', key, re.M) is not None
          has_end = re.search(r'^-----END (RSA )?PRIVATE KEY-----\s*$', key, re.M) is not None

          if not (has_begin and has_end):
            print('AUTO_APPROVE_PRIVATE_KEY is not a PEM private key with BEGIN/END lines.')
            print('Fix: paste the exact contents of the downloaded .pem file (including the BEGIN/END lines and real newlines).')
            sys.exit(1)

          if key.strip().startswith('SHA256:'):
            print('AUTO_APPROVE_PRIVATE_KEY looks like a SHA256 fingerprint, not a PEM private key.')
            sys.exit(1)

          # Export normalized key for subsequent steps without logging it.
          env_path = os.environ.get('GITHUB_ENV')
          if not env_path:
            - name: Normalize GitHub App private key
              id: normalize-key
              env:
                PRIVATE_KEY_RAW: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
              run: |
                python - <<'PY'
                import os

                raw = os.environ.get('PRIVATE_KEY_RAW', '')
                # Some secret UIs paste multiline PEMs as a single line with literal "\\n".
                normalized = raw.replace('\\r\\n', '\\n').replace('\\n', '\n')

                with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                  f.write('private_key<<__KEY__\n')
                  f.write(normalized)
                  if not normalized.endswith('\n'):
                    f.write('\n')
                  f.write('__KEY__\n')
                PY

            - name: Validate GitHub App private key secret
              env:
                PRIVATE_KEY: ${{ steps.normalize-key.outputs.private_key }}
              run: |
                python - <<'PY'
                import os, re, sys

                key = os.environ.get('PRIVATE_KEY', '')
                if not key.strip():
                  print('AUTO_APPROVE_PRIVATE_KEY is empty or not set.')
                  sys.exit(1)

                if key.strip().startswith('SHA256:'):
                  print('AUTO_APPROVE_PRIVATE_KEY looks like a SHA256 fingerprint, not a PEM private key.')
                  sys.exit(1)

                # Do not print the key. Only validate expected PEM markers.
                has_begin = re.search(r'^-----BEGIN (RSA )?PRIVATE KEY-----\s*$', key, re.M) is not None
                has_end = re.search(r'^-----END (RSA )?PRIVATE KEY-----\s*$', key, re.M) is not None

                if not (has_begin and has_end):
                  print('AUTO_APPROVE_PRIVATE_KEY does not look like a PEM private key (missing BEGIN/END PRIVATE KEY lines).')
                  print('Paste the full contents of the .pem file you downloaded from the GitHub App “Private keys” page.')
                  sys.exit(1)

                print('Private key secret format looks like PEM.')
                PY
          REPO: ${{ github.repository }}
        run: |
          gh api \
            -X POST \
            repos/$REPO/pulls/$PR_NUMBER/reviews \
            -f event='APPROVE' \
                private_key: ${{ steps.normalize-key.outputs.private_key }}
