name: PR Required Backend Check

on:
  pull_request:
    branches: [ codespaces-mongo-setup-recovery, main, dev ]

permissions:
  contents: read

concurrency:
  group: pr-required-backend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-required:
    name: backend-required
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Runner-context jobs reach service containers via localhost:published_port.
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: '27017'
      MONGO_DB_TEST: merkato_test
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Create .env.test
        run: |
          TEST_MONGO_URI="mongodb://${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB_TEST}"
          echo "NODE_ENV=test" >> .env.test
          echo "MONGO_URI=$TEST_MONGO_URI" >> .env.test
          echo "MONGO_URI_TEST=$TEST_MONGO_URI" >> .env.test
          echo "JWT_SECRET=test_secret" >> .env.test
          echo "CLIENT_URL=http://localhost:3000" >> .env.test
          echo "EMAIL_USER=test@example.com" >> .env.test
          echo "EMAIL_PASS=test-password" >> .env.test
          echo "OPENAI_API_KEY=" >> .env.test
      - name: Run backend quick compact suite
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://${{ env.MONGO_HOST }}:${{ env.MONGO_PORT }}/${{ env.MONGO_DB_TEST }}
        run: npm run test:quick:compact
