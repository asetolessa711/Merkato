name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Runner-context jobs reach service containers via localhost:published_port.
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: '27017'
      MONGO_DB_TEST: merkato_test
    services:
      mongo:
        image: mongo:6
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1" 
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Create backend/.env.test
        working-directory: backend
        run: |
          TEST_MONGO_URI="mongodb://${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB_TEST}"
          echo "NODE_ENV=test" >> .env.test
          echo "MONGO_URI=$TEST_MONGO_URI" >> .env.test
          echo "MONGO_URI_TEST=$TEST_MONGO_URI" >> .env.test
          echo "JWT_SECRET=test_secret" >> .env.test
          echo "CLIENT_URL=http://localhost:3000" >> .env.test
          echo "EMAIL_USER=test@example.com" >> .env.test
          echo "EMAIL_PASS=test-password" >> .env.test
          echo "OPENAI_API_KEY=" >> .env.test
      - name: Run backend tests
        working-directory: backend
        env:
          MONGO_URI: mongodb://${{ env.MONGO_HOST }}:${{ env.MONGO_PORT }}/${{ env.MONGO_DB_TEST }}
          NODE_ENV: test
        run: npm run test:quick:compact

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Guard against duplicate basenames (.js/.jsx)
        id: dup_guard
        continue-on-error: true
        working-directory: frontend
        run: npm run -s dup:guard
      - name: Duplicate basename guard notice
        if: steps.dup_guard.outcome == 'failure'
        working-directory: frontend
        run: echo "::warning::Duplicate basename guard failed; continuing to frontend tests for actionable signal."
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: npm run test:compact


