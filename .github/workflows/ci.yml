name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1" 
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Create backend/.env.test
        run: |
          echo "NODE_ENV=test" >> backend/.env.test
          echo "MONGO_URI=mongodb://127.0.0.1:27017/merkato_test" >> backend/.env.test
          echo "JWT_SECRET=test_secret" >> backend/.env.test
          echo "CLIENT_URL=http://localhost:3000" >> backend/.env.test
          echo "EMAIL_USER=test@example.com" >> backend/.env.test
          echo "EMAIL_PASS=test-password" >> backend/.env.test
          echo "OPENAI_API_KEY=" >> backend/.env.test
      - name: Run backend tests
        working-directory: backend
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/merkato_test
          NODE_ENV: test
          CI: true
        run: npm test -- --runInBand --coverage

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Guard against duplicate basenames (.js/.jsx)
        working-directory: frontend
        run: npm run -s dup:guard
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --watchAll=false --coverage


