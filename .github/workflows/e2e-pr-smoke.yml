name: E2E PR Smoke (Fast Required Tier)

on:
  pull_request:
    branches: [ codespaces-mongo-setup-recovery, main, dev ]

jobs:
  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 60
    services:
      mongo:
        image: mongo:6
        ports:
          - '27017:27017'
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ./.cache/cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-
      - name: Ensure Cypress binary
        working-directory: ./frontend
        env:
          CI: 'true'
          CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/cypress
        run: npx cypress install --force || npx cypress verify

      - name: Run PR smoke E2E (curated)
        working-directory: ./frontend
        env:
          CI: 'true'
          CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/cypress
        run: npm run e2e:pr

      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: |
            frontend/cypress-results/**
            frontend/test-report/**
            frontend/scope-report.txt
            frontend/cypress-summary.txt
            frontend/pr-comment.md

      - name: Comment PR with summary
        if: always()
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: frontend/pr-comment.md
          comment-tag: e2e-pr-smoke
          mode: upsert
