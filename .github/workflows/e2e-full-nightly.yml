name: E2E Full (Nightly)

on:
  schedule:
    # 02:30 UTC nightly
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  e2e-full:
    name: E2E Full (Nightly) - shard ${{ matrix.shard_index }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2]

    services:
      mongo:
        image: mongo:6
        ports:
          - '27017:27017'
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run full E2E suite (build-and-serve)
        working-directory: frontend
        env:
          # Runner uses ephemeral DB name and drops it afterward
          E2E_EPHEMERAL: 'true'
          E2E_AUTODROP: 'true'
          # Pick a non-standard port to avoid collisions
          E2E_BACKEND_PORT: '5051'
          # Optional: increase default timeouts a bit on CI
          CI: 'true'
          # Force running all specs explicitly and scrub any spec overrides
          E2E_USE_ALL: 'true'
          # Shard specs across parallel runners
          E2E_SPLIT_TOTAL: '3'
          E2E_SPLIT_INDEX: '${{ matrix.shard_index }}'
        run: npm run e2e:run

      - name: Upload Cypress screenshots (shard ${{ matrix.shard_index }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-shard-${{ matrix.shard_index }}
          path: |
            frontend/cypress/screenshots
            !frontend/cypress/screenshots/**/.gitkeep
          retention-days: 7

      - name: Upload Cypress videos (shard ${{ matrix.shard_index }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-shard-${{ matrix.shard_index }}
          path: |
            frontend/cypress/videos
            !frontend/cypress/videos/**/.gitkeep
          retention-days: 7

      - name: Upload logs & summary (shard ${{ matrix.shard_index }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-and-summary-shard-${{ matrix.shard_index }}
          path: |
            frontend/cypress-summary.txt
            frontend/cypress-results/*.json
            frontend/e2e-backend.log
            frontend/e2e-backend.err.log
            frontend/e2e-meta.txt
          retention-days: 7
