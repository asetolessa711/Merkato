name: Frontend Coverage
on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches: [ ci-workflow-hardening ]
    paths:
      - 'frontend/**'

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: |
          cd frontend
          npm ci
      - name: Run coverage
        run: |
          cd frontend
          npm run test:coverage
          npm run coverage:summary
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7
      - name: PR comment coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = path.join(process.cwd(), 'frontend', 'coverage', 'coverage-compact.json');
            if (!fs.existsSync(summaryPath)) {
              core.warning('coverage-compact.json not found');
              return;
            }
            const data = JSON.parse(fs.readFileSync(summaryPath,'utf8'));
            const body = `### Frontend Coverage\n\n| Metric | % |\n|--------|----|\n| Lines | ${data.lines}% |\n| Branches | ${data.branches}% |\n| Functions | ${data.functions}% |\n| Statements | ${data.statements}% |\n\n> Target suggestions: Lines >= 70%, Branches >= 50% initially.\n`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
