name: PR A11y Gate (critical-only, enforced)

on:
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-a11y-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:6
        ports:
          - '27017:27017'
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Restore Cypress binary cache
        id: cypress-cache
        uses: actions/cache@v4
        with:
          path: ./.cache/cypress
          key: cypress-${{ runner.os }}-a11y-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-a11y-
            cypress-${{ runner.os }}-
      - name: Ensure Cypress binary (install/verify)
        if: steps.cypress-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        env:
          CI: 'true'
          CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/cypress
        run: |
          npx cypress install --force || npx cypress verify
      - name: Run a11y (critical-only, enforced)
        id: run_a11y
        working-directory: frontend
        env:
          CI: 'true'
          E2E_EPHEMERAL: 'true'
          E2E_AUTODROP: 'true'
          E2E_BACKEND_PORT: '5051'
          E2E_REUSE_BUILD: 'false'
          CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/cypress
          A11Y_ENFORCE: 'true' # Enforce: fail build on critical violations
          E2E_SPEC: 'cypress/e2e/a11y_smoke.cy.js,cypress/e2e/a11y_auth_pages.cy.js,cypress/e2e/a11y_product_detail.cy.js,cypress/e2e/a11y_high_traffic.cy.js,cypress/e2e/a11y_header_nav.cy.js,cypress/e2e/a11y_cart_with_items.cy.js,cypress/e2e/a11y_checkout_form.cy.js' # Focused subset
        run: |
          npm run e2e:run
      - name: Append Cypress summary to Job Summary
        if: always()
        run: |
          if [ -f "frontend/cypress-summary.txt" ]; then
            echo "## Cypress a11y summary" >> $GITHUB_STEP_SUMMARY
            cat frontend/cypress-summary.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "No cypress-summary.txt found." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload a11y summary and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-artifacts
          path: |
            frontend/cypress-results/a11y-summary.json
            frontend/cypress-results/a11y-auth-summary.json
            frontend/cypress-results/a11y-header-summary.json
            frontend/cypress-results/a11y-cart-summary.json
            frontend/cypress-results/a11y-high-traffic-summary.json
            frontend/cypress-results/a11y-product-detail-summary.json
            frontend/cypress-results/a11y-checkout-summary.json
            frontend/test-report/**/a11y-summary.json
            frontend/test-report/**/a11y-auth-summary.json
            frontend/test-report/**/a11y-header-summary.json
            frontend/test-report/**/a11y-cart-summary.json
            frontend/test-report/**/a11y-high-traffic-summary.json
            frontend/test-report/**/a11y-product-detail-summary.json
            frontend/test-report/**/a11y-checkout-summary.json
            frontend/cypress-summary.txt
            frontend/cypress-results/*.json
            frontend/e2e-meta.txt
          retention-days: 7
      - name: Build A11Y PR Comment
        if: always()
        working-directory: frontend
        run: node ./scripts/make-a11y-pr-comment.js || echo "a11y PR comment generation skipped"
      - name: Post sticky A11Y PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: a11y-summary
          recreate: true
          path: frontend/pr-a11y-comment.md
      - name: Build Failures PR Comment
        if: always()
        working-directory: frontend
        run: node ./scripts/make-failures-pr-comment.js || echo "failures PR comment generation skipped"
      - name: Post sticky Failures PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: e2e-failures
          recreate: true
          path: frontend/pr-failures-comment.md