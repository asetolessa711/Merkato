name: Visual Regression (Chromatic)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/chromatic.yml'
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/chromatic.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  chromatic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate skip labels (skip visual if labeled)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map(l => l.name.toLowerCase());
            const skip = labels.includes('skip-visual') || labels.includes('skip-chromatic');
            core.exportVariable('SKIP_CHROMATIC', skip ? 'true' : 'false');
            if (skip) core.notice('Chromatic skipped due to label.');

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        if: ${{ env.SKIP_CHROMATIC != 'true' }}
        run: npm ci

      - name: Build & Publish Storybook to Chromatic (@visual @trust-ui)
        if: ${{ env.SKIP_CHROMATIC != 'true' }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "Chromatic token missing; skipping (non-fatal).";
            echo "::notice title=Chromatic Skipped::Secret CHROMATIC_PROJECT_TOKEN not set";
            echo "CHROMATIC_REQUIRED=false" >> $GITHUB_ENV
            exit 0;
          fi
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['build-storybook'] ? 0 : 1)"; then
            echo "::notice title=Chromatic Skipped::No build-storybook script found in frontend/package.json";
            echo "CHROMATIC_REQUIRED=false" >> $GITHUB_ENV
            exit 0;
          fi
          echo "CHROMATIC_REQUIRED=true" >> $GITHUB_ENV
          npx chromatic \
            --project-token=$CHROMATIC_PROJECT_TOKEN \
            --build-script-name=build-storybook \
            --only-changed \
            --exit-zero-on-changes \
            --exit-once-uploaded \
            --json=chromatic-output.json
          echo "CHROMATIC_AVAILABLE=true" >> $GITHUB_ENV

      - name: Upload Chromatic JSON (debug)
        if: ${{ env.CHROMATIC_AVAILABLE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-output
          path: frontend/chromatic-output.json

      - name: Enforce Chromatic presence (fail-fast)
        if: ${{ env.SKIP_CHROMATIC != 'true' && env.CHROMATIC_REQUIRED == 'true' && env.CHROMATIC_AVAILABLE != 'true' }}
        run: |
          echo "::error title=Chromatic Required::Chromatic publish skipped or failed without skip label.";
          exit 1

      - name: Gate @trust-ui visual diffs
        run: |
          if [ "${CHROMATIC_AVAILABLE}" = "true" ]; then node ./scripts/visual-gate.js; else echo "Chromatic not available; skip gate"; fi

      - name: Visual Summary (Step Summary)
        if: ${{ env.CHROMATIC_AVAILABLE == 'true' }}
        run: node ./scripts/visual-summary.js

      - name: Comment with Chromatic build URL
        if: ${{ github.event_name == 'pull_request' && env.CHROMATIC_AVAILABLE == 'true' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            if (!process.env.CHROMATIC_AVAILABLE) { return }
            const fs = require('fs')
            let buildStatus = 'unknown'
            let trustDiffs = 0
            try {
              const raw = fs.readFileSync('frontend/chromatic-output.json','utf8')
              buildStatus = (raw.match(/"status":"(.*?)"/)||[])[1] || buildStatus
              trustDiffs = (raw.match(/@trust-ui/g)||[]).length
            } catch(e) {}
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              '### 🖼️ Chromatic Visual Regression',
              '',
              'Status: ' + buildStatus,
              trustDiffs ? ('@trust-ui story diffs detected: ' + trustDiffs) : 'No @trust-ui diffs detected.',
              '',
              'Review & approve in Chromatic dashboard as needed.',
              '',
              'Workflow Run: ' + runUrl,
              '',
              'Tag stories with @trust-ui or persona tags (e.g., @persona-ui:customer) to prioritize review.'
            ].join('\n')
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            })
