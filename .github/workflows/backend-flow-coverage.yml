name: Backend Flow Coverage (matrix)

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  flow:
    name: Flow "${{ matrix.flow }}" coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_HOST: mongo
      MONGO_PORT: '27017'
      MONGO_DB_TEST: merkato_test
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        flow: [ auth, orders, vendor, checkout, payments, admin ]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Create .env.test
        run: |
          TEST_MONGO_URI="mongodb://${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB_TEST}"
          echo "NODE_ENV=test" >> .env.test
          echo "MONGO_URI=$TEST_MONGO_URI" >> .env.test
          echo "MONGO_URI_TEST=$TEST_MONGO_URI" >> .env.test
          echo "JWT_SECRET=test_secret" >> .env.test
          echo "CLIENT_URL=http://localhost:3000" >> .env.test
          echo "EMAIL_USER=test@example.com" >> .env.test
          echo "EMAIL_PASS=test-password" >> .env.test

      - name: Start backend (flow coverage) on port 5000
        working-directory: backend
        run: |
          nohup npm start > backend.log 2>&1 &
          echo "Started backend for flow '${{ matrix.flow }}' coverage; waiting for /api health."
        env:
          PORT: 5000
          MONGO_URI: mongodb://${{ env.MONGO_HOST }}:${{ env.MONGO_PORT }}/${{ env.MONGO_DB_TEST }}
          JWT_SECRET: test_secret

      - name: Wait for backend health
        run: npx wait-on --timeout=90000 http://localhost:5000/api

      - name: Show backend log if wait failed
        if: failure()
        run: |
          echo "---- backend.log (tail) ----"
          tail -n 200 backend.log || true

      - name: Run flow tests (${{ matrix.flow }})
        env:
          CI: true
          NODE_ENV: test
          MONGO_URI: mongodb://${{ env.MONGO_HOST }}:${{ env.MONGO_PORT }}/${{ env.MONGO_DB_TEST }}
          FLOW_COVERAGE: "true"
          JEST_DISABLE_THRESHOLD: "true"
        run: |
          npm run test:flow:${{ matrix.flow }} --silent

      - name: Show backend log after tests (failure only)
        if: failure()
        run: |
          echo "---- backend.log (tail after tests) ----"
          tail -n 200 backend.log || true

      - name: Upload coverage artifact (${{ matrix.flow }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-${{ matrix.flow }}
          path: backend/coverage/${{ matrix.flow }}
          if-no-files-found: warn

      - name: Upload backend log (${{ matrix.flow }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-${{ matrix.flow }}
          path: backend/backend.log
          if-no-files-found: warn
