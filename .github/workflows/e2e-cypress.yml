name: E2E Cypress Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:5
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MONGO_URI: mongodb://localhost:27017/merkato_test
      JWT_SECRET: test_secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Cypress
            frontend/node_modules/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Verify Cypress binary
        working-directory: frontend
        run: npx cypress install --force

      - name: Start backend (port 5000)
        working-directory: backend
        # Previously used start:5001 (hard-coded PORT=5001) while waiting on :5000 causing wait-on timeout.
        # Use default start script (server.js -> PORT env or 5000 fallback) so /api becomes reachable on :5000.
        run: |
          nohup npm start > backend.log 2>&1 &
          echo "Backend starting... (expecting port 5000)"
        env:
          PORT: 5000
          MONGO_URI: ${{ env.MONGO_URI }}
          JWT_SECRET: ${{ env.JWT_SECRET }}

      - name: Wait for backend
        run: npx wait-on --timeout=120000 http://localhost:5000/api

      - name: Show backend log on failure
        if: failure()
        run: |
          echo "---- backend.log (last 200 lines) ----"
          tail -n 200 backend/backend.log || true

      - name: Upload backend.log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          if-no-files-found: warn

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:5000

      - name: Serve frontend (React SPA)
        working-directory: frontend
        run: |
          nohup npx serve -s build -l 3000 > serve.log 2>&1 &
          sleep 2

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome
        env:
          CYPRESS_baseUrl: http://localhost:3000

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          retention-days: 7

