name: Prevent JS/JSX Twins

on:
  pull_request:
    branches: [ main, master, develop, chore/**, feat/**, fix/** ]
  push:
    branches: [ main, master, develop ]

jobs:
  check-twins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run twin guard
        run: node scripts/check-no-js-jsx-twins.js
