services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: merkato
      POSTGRES_PASSWORD: merkato
      POSTGRES_DB: merkato
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - merkato-postgres-data:/var/lib/postgresql/data

volumes:
  merkato-postgres-data:
